plugins {
    id 'com.android.application'
}

android {
    namespace 'com.app.rush47'
    compileSdk 34

    defaultConfig {
        applicationId "com.app.rush47"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // FIX for "App not installed": without this, Gradle falls back to
            // ~/.android/debug.keystore. On a GitHub Actions runner that file
            // doesn't exist yet, so AGP silently generates a BRAND NEW random
            // one on every single CI run - meaning every build has a
            // different signature, and Android refuses to install a new APK
            // over any previous build of the same app (different signature =
            // "App not installed", not a real error, just Android protecting
            // against a fake update). Using this committed, fixed keystore
            // instead means every build signs the same way, so installing a
            // new build over an old one works like a normal app update.
            storeFile file('keystore/rush47-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.android.volley:volley:1.2.1'

    // Play page (dashboard) dependencies
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
}
